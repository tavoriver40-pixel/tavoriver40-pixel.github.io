<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consorcio Tato Joven">
<meta name="theme-color" content="#12110f">
<title>Consorcio Tato Joven Mobile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23c9921a' width='180' height='180'/><text x='50%' y='50%' font-size='90' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>CJ</text></svg>">
<style>
:root {
  --bg: #f7f5f0;
  --white: #fff;
  --ink: #12110f;
  --ink2: #3d3b36;
  --muted: #9b9790;
  --line: #e4e1da;
  --green: #1d6b3e;
  --green-bg: #edf7f1;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --blue: #1e40af;
  --blue-bg: #eff6ff;
  --purple: #6d28d9;
  --purple-bg: #f5f3ff;
  --gold: #c9921a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
}

body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
}

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 4px rgba(0,0,0,.05);
}

.topbar-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}

.topbar-badge {
  font-size: 11px;
  background: var(--amber-bg);
  color: var(--amber);
  padding: 4px 8px;
  border-radius: 12px;
  border: 1px solid #fde68a;
}

.main {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  margin-bottom: 60px;
}

.nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  cursor: pointer;
  color: var(--muted);
  font-size: 10px;
  transition: all .15s;
}

.nav-item.active {
  color: var(--gold);
}

.nav-icon {
  font-size: 20px;
  margin-bottom: 2px;
}

.page {
  display: none;
  animation: fadeIn .3s;
}

.page.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  position: relative;
}

.kpi::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  border-radius: 6px 6px 0 0;
}

.kpi.k-green::before { background: var(--green); }
.kpi.k-red::before { background: var(--red); }
.kpi.k-amber::before { background: var(--amber); }
.kpi.k-gold::before { background: var(--gold); }

.kpi-label {
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.kpi-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.2;
}

.section-title {
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--ink2);
  font-weight: 600;
  margin: 16px 0 8px;
}

.prop-item {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.prop-left {
  flex: 1;
}

.prop-uf {
  display: inline-block;
  background: var(--ink);
  color: white;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  margin-bottom: 4px;
  font-weight: 600;
}

.prop-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin: 2px 0;
}

.prop-status {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.prop-amount {
  font-size: 14px;
  font-weight: 700;
  text-align: right;
}

.amount-ok { color: var(--green); }
.amount-pending { color: var(--red); }
.amount-mora { color: var(--amber); }

.form-section {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px;
  margin-bottom: 12px;
}

.form-group {
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

label {
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

input, select, textarea {
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 10px;
  outline: none;
  width: 100%;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--ink);
  background: var(--white);
}

.btn {
  padding: 10px 14px;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  transition: all .15s;
  width: 100%;
  margin-top: 10px;
}

.btn-primary {
  background: var(--ink);
  color: white;
}

.btn-primary:active {
  background: var(--gold);
  color: var(--ink);
}

.btn-success {
  background: var(--green);
  color: white;
}

.btn-success:active {
  background: #155e32;
}

.btn-danger {
  background: var(--red);
  color: white;
}

.btn-danger:active {
  background: #991b1b;
}

.btn-gold {
  background: var(--gold);
  color: var(--ink);
}

.btn-gold:active {
  background: #b5820f;
}

.badge {
  display: inline-block;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}

.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-amber { background: var(--amber-bg); color: var(--amber); }
.badge-blue { background: var(--blue-bg); color: var(--blue); }

.sync-banner {
  background: var(--blue-bg);
  border: 1px solid #bfdbfe;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--blue);
}

.sync-icon {
  font-size: 14px;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.sync-icon.done {
  animation: none;
  color: var(--green);
}

.sync-mode-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.mode-btn {
  padding: 10px;
  border: 2px solid var(--line);
  background: var(--white);
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
  font-weight: 600;
  transition: all .15s;
}

.mode-btn.active {
  border-color: var(--gold);
  background: #fffbeb;
  color: var(--gold);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: flex-end;
  z-index: 100;
  display: none;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--white);
  width: 100%;
  border-radius: 12px 12px 0 0;
  padding: 16px;
  padding-top: 20px;
  animation: slideUp .3s;
  max-height: 80vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--ink);
}

.close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--muted);
}

.table-scroll {
  overflow-x: auto;
  margin-bottom: 8px;
}

table {
  width: 100%;
  font-size: 11px;
  border-collapse: collapse;
}

table thead {
  background: var(--bg);
  position: sticky;
  top: 0;
}

table th {
  padding: 8px 6px;
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

table td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
}

table tr:hover {
  background: rgba(201,146,26,.04);
}

.text-right { text-align: right; }
.text-center { text-align: center; }

.whatsapp-btn {
  background: #25D366;
  color: white;
  padding: 10px;
  border-radius: 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  text-decoration: none;
  display: inline-block;
}

.whatsapp-btn:active {
  opacity: 0.8;
}

.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--muted);
}

.empty-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.empty-text {
  font-size: 12px;
  line-height: 1.6;
}

.loader {
  text-align: center;
  padding: 20px;
}

.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-title">Consorcio Tato Joven</div>
    <div class="topbar-badge" id="topbar-sync">📡 Modo: GitHub</div>
  </div>

  <div class="main">
    <!-- DASHBOARD -->
    <div id="dashboard-page" class="page active">
      <div id="sync-banner"></div>

      <div class="sync-mode-selector">
        <div class="mode-btn active" onclick="setMode('github')">🌐 GitHub</div>
        <div class="mode-btn" onclick="setMode('local')">📱 WiFi Local</div>
      </div>

      <div class="section-title">Resumen Mes Actual</div>
      <div class="kpi-grid">
        <div class="kpi k-gold">
          <div class="kpi-label">Expensa Fija</div>
          <div class="kpi-value">$50.000</div>
        </div>
        <div class="kpi k-green">
          <div class="kpi-label">Recaudado</div>
          <div class="kpi-value" id="kpi-recaudado">$0</div>
        </div>
        <div class="kpi k-red">
          <div class="kpi-label">Pendiente</div>
          <div class="kpi-value" id="kpi-pendiente">$0</div>
        </div>
        <div class="kpi k-amber">
          <div class="kpi-label">Con Mora</div>
          <div class="kpi-value" id="kpi-mora">0</div>
        </div>
      </div>

      <div class="section-title">Estado de Pagos</div>
      <div id="dashboard-props"></div>
    </div>

    <!-- PROPIETARIOS -->
    <div id="props-page" class="page">
      <div class="section-title">Todos los Propietarios</div>
      <div id="props-list"></div>
    </div>

    <!-- REGISTRAR PAGO -->
    <div id="cobro-page" class="page">
      <div class="form-section">
        <div class="section-title">Registrar Pago</div>
        <div class="form-group">
          <label>Unidad Funcional</label>
          <select id="cobro-uf"></select>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select id="cobro-tipo">
            <option value="expensa">Expensa Fija ($50.000)</option>
            <option value="recargo">Recargo por mora (10%)</option>
            <option value="parcial">Pago Parcial</option>
          </select>
        </div>
        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" id="cobro-monto" value="50000" step="0.01">
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="cobro-fecha">
        </div>
        <div class="form-group">
          <label>Observaciones</label>
          <input type="text" id="cobro-obs" placeholder="Opcional...">
        </div>
        <button class="btn btn-success" onclick="registrarCobro()">✓ Registrar</button>
      </div>
      <div id="cobro-mensaje"></div>
    </div>

    <!-- CALCULADORA MORA -->
    <div id="mora-page" class="page">
      <div class="form-section">
        <div class="section-title">Calculadora de Mora</div>
        <div class="form-group">
          <label>Expensa Base ($)</label>
          <input type="number" id="mora-base" value="50000">
        </div>
        <div class="form-group">
          <label>Meses de Atraso</label>
          <input type="number" id="mora-meses" value="1" min="1">
        </div>
        <button class="btn btn-gold" onclick="calcularMora()">Calcular</button>
      </div>
      <div id="mora-result"></div>
    </div>

    <!-- AVISOS -->
    <div id="avisos-page" class="page">
      <div class="section-title">Enviar Avisos WhatsApp</div>
      <div id="avisos-list"></div>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="navigate('dashboard')">
      <div class="nav-icon">📊</div>
      <div>Dashboard</div>
    </div>
    <div class="nav-item" onclick="navigate('props')">
      <div class="nav-icon">👥</div>
      <div>Propietarios</div>
    </div>
    <div class="nav-item" onclick="navigate('cobro')">
      <div class="nav-icon">💰</div>
      <div>Registrar</div>
    </div>
    <div class="nav-item" onclick="navigate('mora')">
      <div class="nav-icon">⚠️</div>
      <div>Mora</div>
    </div>
    <div class="nav-item" onclick="navigate('avisos')">
      <div class="nav-icon">📱</div>
      <div>Avisos</div>
    </div>
  </div>
</div>

<script>
// ================== CONFIG ==================
const CONFIG = {
  EXP_FIJA: 50000,
  RECARGO_PCT: 0.10,
  GITHUB_REPO: 'tavoriver40-pixel/tavoriver40-pixel.github.io',
  GITHUB_FILE: 'consorcio.json.bak',
  MES_ACTUAL: new Date().toISOString().slice(0,7),
};

// ================== STATE ==================
let meses = {};
let syncMode = 'github'; // 'github' o 'local'
let localServerUrl = null;
let syncInterval = null;

// ================== INIT ==================
document.addEventListener('DOMContentLoaded', () => {
  setToday();
  cargarDatos();
  crearSelectUF();
  renderDashboard();
  setInterval(() => { if(syncMode==='github') cargarDatos(); }, 30000); // Auto-sync cada 30s
});

// ================== SYNC FUNCTIONS ==================
async function cargarDatos() {
  try {
    mostrarSyncBanner('Sincronizando...');

    let datos;
    if(syncMode === 'github') {
      datos = await cargarDesdeGitHub();
    } else {
      datos = await cargarDesdeLocal();
    }

    if(datos) {
      meses = datos.meses || {};
      renderDashboard();
      crearSelectUF();
      mostrarSyncBanner('✅ Sincronizado hace poco', true);
    }
  } catch(err) {
    console.error('Error sincronizando:', err);
    mostrarSyncBanner('❌ Error: ' + err.message, false);
  }
}

async function cargarDesdeGitHub() {
  const url = `https://raw.githubusercontent.com/${CONFIG.GITHUB_REPO}/main/consorcio.json.bak`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo leer desde GitHub');
  return await res.json();
}

async function cargarDesdeLocal() {
  if(!localServerUrl) {
    const ip = prompt('IP de tu PC (ej: 192.168.1.100):');
    if(!ip) throw new Error('IP requerida');
    localServerUrl = `http://${ip}:8888`;
  }

  const res = await fetch(localServerUrl + '/api/datos');
  if(!res.ok) throw new Error('No se conecta con tu PC');
  return await res.json();
}

function setMode(mode) {
  syncMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('topbar-sync').textContent = mode === 'github' ? '🌐 GitHub' : '📱 WiFi';
  cargarDatos();
}

function mostrarSyncBanner(msg, ok=null) {
  const banner = document.getElementById('sync-banner');
  banner.innerHTML = `<span class="sync-icon ${ok?'done':''}">${ok===true?'✅':ok===false?'❌':'⟳'}</span> <span>${msg}</span>`;
}

// ================== RENDER FUNCTIONS ==================
function renderDashboard() {
  const mes = CONFIG.MES_ACTUAL;
  const cobros = meses[mes]?.cobros || [];

  let recaudado = 0, pendiente = 0, conMora = 0;

  cobros.forEach(c => {
    if(c.tipo === 'expensa' || c.tipo === 'recargo') recaudado += c.monto;
  });

  pendiente = (PROPIETARIOS.length * CONFIG.EXP_FIJA) - recaudado;
  conMora = PROPIETARIOS.filter(p => tieneMorella(p.uf, mes)).length;

  document.getElementById('kpi-recaudado').textContent = fmt(recaudado);
  document.getElementById('kpi-pendiente').textContent = fmt(pendiente);
  document.getElementById('kpi-mora').textContent = conMora;

  let html = '';
  PROPIETARIOS.forEach(p => {
    const pagado = cobros.filter(c => c.uf === p.uf).reduce((s,c) => s+c.monto, 0);
    const estado = pagado >= CONFIG.EXP_FIJA ? '✅ Al día' : '⚠️ Pendiente';
    const color = pagado >= CONFIG.EXP_FIJA ? 'amount-ok' : 'amount-pending';

    html += `
      <div class="prop-item">
        <div class="prop-left">
          <div class="prop-uf">${p.uf}</div>
          <div class="prop-name">${p.nombre}</div>
          <div class="prop-status">${estado}</div>
        </div>
        <div class="prop-amount ${color}">$${fmt(pagado)}</div>
      </div>
    `;
  });

  document.getElementById('dashboard-props').innerHTML = html || '<div class="empty-state">Sin datos</div>';
}

function renderPropietarios() {
  const mes = CONFIG.MES_ACTUAL;
  const cobros = meses[mes]?.cobros || [];

  let html = '<div class="table-scroll"><table><thead><tr><th>UF</th><th>Nombre</th><th class="text-right">Pagado</th><th>Estado</th></tr></thead><tbody>';

  PROPIETARIOS.forEach(p => {
    const pagado = cobros.filter(c => c.uf === p.uf).reduce((s,c) => s+c.monto, 0);
    const estado = pagado >= CONFIG.EXP_FIJA ? '✅' : pagado > 0 ? '⏳' : '❌';
    html += `<tr><td><strong>${p.uf}</strong></td><td>${p.nombre}</td><td class="text-right">${fmt(pagado)}</td><td>${estado}</td></tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('props-list').innerHTML = html;
}

function renderAvisos() {
  const mes = CONFIG.MES_ACTUAL;
  const cobros = meses[mes]?.cobros || [];

  let html = '';
  PROPIETARIOS.forEach(p => {
    const pagado = cobros.filter(c => c.uf === p.uf).reduce((s,c) => s+c.monto, 0);
    if(pagado < CONFIG.EXP_FIJA) {
      const falta = CONFIG.EXP_FIJA - pagado;
      const msg = `Hola ${p.nombre}, te recordamos que tu expensa del consorcio es de $${fmt(CONFIG.EXP_FIJA)}. Pendiente: $${fmt(falta)}. Gracias.`;
      const wsLink = `https://wa.me/?text=${encodeURIComponent(msg)}`;

      html += `
        <div class="form-section">
          <div class="prop-uf">${p.uf}</div>
          <div class="prop-name">${p.nombre}</div>
          <div class="prop-status">Pendiente: $${fmt(falta)}</div>
          <a href="${wsLink}" class="whatsapp-btn">📱 Enviar WhatsApp</a>
        </div>
      `;
    }
  });

  document.getElementById('avisos-list').innerHTML = html || '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">Todos pagaron! 🎉</div></div>';
}

// ================== FORM FUNCTIONS ==================
function crearSelectUF() {
  const select = document.getElementById('cobro-uf');
  select.innerHTML = PROPIETARIOS.map(p => `<option value="${p.uf}">${p.uf} - ${p.nombre}</option>`).join('');
}

function registrarCobro() {
  const uf = document.getElementById('cobro-uf').value;
  const tipo = document.getElementById('cobro-tipo').value;
  const monto = parseFloat(document.getElementById('cobro-monto').value);
  const fecha = document.getElementById('cobro-fecha').value;
  const obs = document.getElementById('cobro-obs').value;

  if(!fecha || !monto) {
    alert('Completa fecha y monto');
    return;
  }

  const mes = fecha.slice(0,7);
  if(!meses[mes]) meses[mes] = {label: `Mes ${mes}`, cobros: [], egresos: [], convenios: [], recibos: []};

  meses[mes].cobros.push({uf, tipo, monto, fecha, obs});

  document.getElementById('cobro-uf').value = '';
  document.getElementById('cobro-monto').value = '50000';
  document.getElementById('cobro-fecha').value = '';
  document.getElementById('cobro-obs').value = '';
  document.getElementById('cobro-mensaje').innerHTML = '<div class="sync-banner" style="background:var(--green-bg);border-color:#bbf7d0;color:var(--green);">✅ Pago registrado</div>';

  setTimeout(() => { document.getElementById('cobro-mensaje').innerHTML = ''; }, 3000);
  renderDashboard();
}

function calcularMora() {
  const base = parseFloat(document.getElementById('mora-base').value);
  const meses = parseInt(document.getElementById('mora-meses').value);
  const recargo = base * CONFIG.RECARGO_PCT * meses;
  const total = base + recargo;

  document.getElementById('mora-result').innerHTML = `
    <div class="form-section">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);">
        <span>Base:</span>
        <strong>$${fmt(base)}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--red);">
        <span>Recargo 10% × ${meses} mes${meses>1?'es':''}:</span>
        <strong>$${fmt(recargo)}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;padding:12px 0;font-weight:700;font-size:14px;color:var(--red);border-top:2px solid var(--ink);">
        <span>Total a pagar:</span>
        <strong>$${fmt(total)}</strong>
      </div>
    </div>
  `;
}

function setToday() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('cobro-fecha').value = today;
}

// ================== NAVIGATION ==================
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page + '-page').classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');

  // Render dinámico
  if(page === 'dashboard') renderDashboard();
  if(page === 'props') renderPropietarios();
  if(page === 'avisos') renderAvisos();
}

// ================== UTILS ==================
function fmt(n) {
  return new Intl.NumberFormat('es-AR', {minimumFractionDigits:0}).format(Math.round(n));
}

function tieneMorella(uf, mes) {
  const cobros = meses[mes]?.cobros || [];
  const pagado = cobros.filter(c => c.uf === uf).reduce((s,c) => s+c.monto, 0);
  return pagado < CONFIG.EXP_FIJA && new Date(`${mes}-11`) < new Date();
}

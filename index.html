<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consorcio Tato Joven - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            height: 90vh;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        .header {
            background: #0ea5e9;
            color: white;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header-info {
            font-size: 13px;
            opacity: 0.95;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .time-display {
            font-weight: 600;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            background: #4ade80;
        }

        .status-closed {
            background: #f87171;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 70%;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.bot .message-content {
            background: #e0f2fe;
            color: #0c4a6e;
            border-left: 3px solid #0ea5e9;
        }

        .message.user .message-content {
            background: #0ea5e9;
            color: white;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            background: white;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.1);
        }

        button {
            padding: 10px 14px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #0284c7;
        }

        button:active {
            transform: scale(0.98);
        }

        .quick-replies {
            padding: 0 16px 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .quick-reply-btn {
            padding: 6px 12px;
            background: #e0f2fe;
            color: #0c4a6e;
            border: 1px solid #06b6d4;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover {
            background: #06b6d4;
            color: white;
        }

        .image-section {
            width: 350px;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        .street-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .contact-info {
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            flex: 1;
            overflow-y: auto;
        }

        .contact-info h3 {
            font-size: 14px;
            color: #0ea5e9;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .contact-item {
            font-size: 13px;
            margin-bottom: 10px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item a {
            color: #0ea5e9;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 3px solid #0ea5e9;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #0c4a6e;
            line-height: 1.4;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #0ea5e9;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-right: 4px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .image-section {
                width: 100%;
                max-height: 300px;
            }

            .street-image {
                height: 200px;
            }

            .message-content {
                max-width: 85%;
            }
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #0ea5e9;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            40% {
                transform: translateY(-8px);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>

            <div class="contact-info">
                <h3>📍 Ubicación</h3>
                <p class="contact-item">Gutemberg 1931</p>

                <h3 style="margin-top: 16px;">📞 Contacto</h3>
                <p class="contact-item">
                    <span>Teléfono:</span>
                    <a href="tel:1130591621">1130591621</a>
                </p>
                <p class="contact-item">
                    <span>Email:</span>
                    <a href="mailto:tavoriver@yahoo.com.ar">tavoriver@yahoo.com.ar</a>
                </p>

                <h3 style="margin-top: 16px;">💰 Fondo de Obras</h3>
                <div class="info-box">
                    <strong>Saldo Disponible:</strong><br/>$75,000.00
                </div>

                <h3 style="margin-top: 16px;">⏰ Horario</h3>
                <div class="info-box">
                    <strong>Atención:</strong><br/>14:00 - 18:00 hs
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLAUDE_API_KEY = 'REEMPLAZAR_CON_TU_API_KEY';
        const CLAUDE_API_URL = 'https://api.anthropic.com/v1/messages';

        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentTimeDisplay = document.getElementById('currentTime');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const quickRepliesContainer = document.getElementById('quickRepliesContainer');

        const businessHoursStart = 14;
        const businessHoursEnd = 18;

        const systemPrompt = `Eres un asistente virtual para el Consorcio Tato Joven ubicado en Gutemberg 1931.

Tu objetivo es proporcionar información precisa y útil sobre asuntos del consorcio a los residentes.

INFORMACIÓN IMPORTANTE DEL CONSORCIO:
- Horario de atención: 14:00 a 18:00 horas
- Teléfono: 1130591621
- Email: tavoriver@yahoo.com.ar

FONDO DE OBRAS (Circular 004):
- Saldo actual disponible: $75,000.00
- Total aportado: $75,000.00
- Unidades que han aportado: 3 de 10
- Gastos ejecutados: $0.00
- Aportes voluntarios de residentes
- Banco: Brubank
- Alias: gustavoperedo
- CBU: 1430001713049409400019
- Titular: Gustavo Fabián Peredo
- Comprobantes disponibles por WhatsApp: 11 3059-1621
- Los aportes se mantienen en cuenta separada con transparencia
- Los rendimientos van al fondo

DIRECTRICES DE RESPUESTA:
1. Sé profesional, educado y cordial en todo momento
2. Si alguien pregunta sobre el Fondo de Obras, explica claramente:
   - Qué es y para qué sirve
   - Cómo se pueden hacer aportes voluntarios
   - Los beneficios de contribuir
   - Cómo se garantiza la transparencia
3. Responde preguntas sobre expensas, mora, pagos y estados de cuentas de manera clara
4. Si la pregunta es fuera de tu conocimiento, sugiere que se comuniquen por teléfono o email
5. Mantén un tono profesional pero amable y accesible

DATOS DE EJEMPLO (actualiza según disponibilidad real):
- Puedes consultar sobre los servicios del consorcio
- Puedes explicar cómo acceder a reportes de expensas
- Puedes dar información sobre el fondo de obras y contribuciones voluntarias`;

        let conversationHistory = [];

        // Actualizar hora en tiempo real
        function updateTime() {
            const now = new Date();
            const options = {
                timeZone: 'America/Argentina/Buenos_Aires',
                hour12: false,
                hour: '2-digit',
                minute: '2-digit'
            };
            const timeString = now.toLocaleString('es-AR', options);
            currentTimeDisplay.textContent = timeString;

            const hours = parseInt(timeString.split(':')[0]);
            const isOpen = hours >= businessHoursStart && hours < businessHoursEnd;

            if (isOpen) {
                statusIndicator.classList.remove('status-closed');
                statusText.textContent = '✓ Atendiendo';
                statusText.style.color = '#4ade80';
            } else {
                statusIndicator.classList.add('status-closed');
                statusText.textContent = '✗ Fuera de horario';
                statusText.style.color = '#f87171';
            }
        }

        updateTime();
        setInterval(updateTime, 60000);

        // Mostrar preguntas rápidas
        function showQuickReplies(isBusinessHours) {
            quickRepliesContainer.innerHTML = '';

            const replies = isBusinessHours ? [
                '¿Cuál es el saldo del Fondo de Obras?',
                '¿Cómo puedo aportar al Fondo?',
                '¿Cuáles son mis expensas?',
                '¿Cómo consultar mis pagos?'
            ] : [
                'Ver información de contacto',
                '¿Cuál es el horario de atención?',
                'Más información sobre el Fondo'
            ];

            replies.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply-btn';
                btn.textContent = reply;
                btn.onclick = () => {
                    userInput.value = reply;
                    sendMessage();
                };
                quickRepliesContainer.appendChild(btn);
            });
        }

        // Verificar si es horario de atención
        function isBusinessHours() {
            const now = new Date();
            const hours = now.getHours();
            return hours >= businessHoursStart && hours < businessHoursEnd;
        }

        // Agregar mensaje a la interfaz
        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Mostrar indicador de escritura
        function showLoadingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'loading-indicator';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remover indicador de escritura
        function removeLoadingIndicator() {
            const loadingEl = document.getElementById('loading-indicator');
            if (loadingEl) loadingEl.remove();
        }

        // Enviar mensaje a Claude API
        async function sendToClaudeAPI(userMessage) {
            if (!CLAUDE_API_KEY || CLAUDE_API_KEY === 'REEMPLAZAR_CON_TU_API_KEY') {
                return "⚠️ API Key no configurada. Por favor, reemplaza 'REEMPLAZAR_CON_TU_API_KEY' con tu clave real en el código.";
            }

            const hours = new Date().getHours();
            const outsideHours = hours < businessHoursStart || hours >= businessHoursEnd;

            let enhancedSystemPrompt = systemPrompt;
            if (outsideHours) {
                enhancedSystemPrompt += `\n\nNOTA IMPORTANTE: El horario de atención es de 14:00 a 18:00 horas. Ahora es ${hours}:${new Date().getMinutes().toString().padStart(2, '0')} fuera del horario de atención.
Responde de manera formal y cortés, informando que fuera del horario de atención solo puedes proporcionar información general. Sugiere que se comuniquen durante el horario de atención para consultas específicas.`;
            }

            conversationHistory.push({
                role: 'user',
                content: userMessage
            });

            try {
                showLoadingIndicator();

                const response = await fetch(CLAUDE_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': CLAUDE_API_KEY,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 1024,
                        system: enhancedSystemPrompt,
                        messages: conversationHistory
                    })
                });

                removeLoadingIndicator();

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    if (response.status === 401) {
                        return "❌ Error de autenticación. Verifica que tu API Key sea válida.";
                    }
                    return "❌ Error al procesar la solicitud. Por favor, intenta más tarde.";
                }

                const data = await response.json();
                const assistantMessage = data.content[0].text;

                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                return assistantMessage;

            } catch (error) {
                removeLoadingIndicator();
                console.error('Error:', error);
                return "❌ Error de conexión. Verifica tu conexión a internet.";
            }
        }

        // Enviar mensaje
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            const response = await sendToClaudeAPI(message);
            addMessage(response, false);
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Inicializar
        showQuickReplies(isBusinessHours());
        addMessage('¡Bienvenido al Consorcio Tato Joven! 👋 ¿En qué puedo ayudarte?', false);
    </script>
</body>
</html>
